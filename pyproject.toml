[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentshield-mcp"
version = "0.4.3"
description = "IntentShield for MCP: an offline-first security guardrail against prompt injection in MCP tool calls, with hooks for Claude Code, Codex CLI, Cursor and Gemini CLI and a transparent MCP proxy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Maddali Suhas Choudary" }]
requires-python = ">=3.12"
keywords = [
  "intentshield", "mcp", "model-context-protocol", "mcp-security", "mcp-proxy", "prompt-injection", "tool-poisoning",
  "guardrail", "guardrails", "agent-security", "llm-security", "ai-security", "claude-code", "codex", "cursor", "gemini-cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "mcp>=2.2,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.13,<3",
  "numpy>=1.26,<3",
  "pytest>=8,<10",
  "ruff>=0.14,<1",
]
# The exemplar detector and learning from operator labels (exemplars.py, learning.py); its
# embedder also needs the ML requirements (requirements-ml.txt).
learning = [
  "numpy>=1.26,<3",
]

[project.urls]
Homepage = "https://github.com/Suhas-123-cell/IntentShield"
Repository = "https://github.com/Suhas-123-cell/IntentShield"
Documentation = "https://github.com/Suhas-123-cell/IntentShield/blob/main/docs/README.md"
Issues = "https://github.com/Suhas-123-cell/IntentShield/issues"
Changelog = "https://github.com/Suhas-123-cell/IntentShield/blob/main/CHANGELOG.md"

[project.scripts]
intentshield = "intentshield.__main__:main"
intentshield-mcp = "intentshield.mcp_server:main"
intentshield-demo-mcp = "intentshield.demo_mcp_server:main"
intentshield-mcp-verify = "intentshield.mcp_verify:main"
intentshield-hook = "intentshield.harness:main"
intentshield-wrap-hook = "intentshield.wrap_hook:main"
intentshield-eval = "intentshield.evaluation:main"
intentshield-threats = "intentshield.threat_memory:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# The package and what it builds from. Not tests/ or benchmarks/: the tests read the study's docs and
# committed traces (results/, docs/), which are too large to ship, so a test run needs a clone of the repository.
# A leading slash anchors a name at the project root; a bare README.md would also match every README.md in docs/ and results/.
include = ["/src/intentshield", "/configs", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/pyproject.toml",
           "/requirements-ml.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/intentshield"]

[tool.hatch.build.targets.wheel.force-include]
"configs/policy.json" = "intentshield/configs/policy.json"
"configs/mcp-proxy.uvx.json" = "intentshield/configs/mcp-proxy.demo.json"

[tool.mypy]
python_version = "3.12"
files = ["src/intentshield"]

# Optional or untyped third-party packages: the ML extras are not installed in CI, jsonschema ships no stubs.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "huggingface_hub", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 130
target-version = "py312"
# prevalence: one-off GitHub census scripts kept for provenance, not maintained code
extend-exclude = ["artifacts", "results", "benchmarks/hook_fidelity/prevalence"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "E731", "B008", "B023", "B904", "B905", "UP035", "UP037"]

[tool.ruff.lint.per-file-ignores]
# The corpus readings are prose data (long quoted lines, printf-style row builders): not code style.
"benchmarks/hook_fidelity/corpus_build/*.py" = ["E501", "UP031", "I001"]
# Guard capture and replay: long prose strings (reasons, quoted payloads, table rows) are data, not code style.
"benchmarks/hook_fidelity/guard_capture.py" = ["E501"]
"benchmarks/hook_fidelity/guard_replay.py" = ["E501"]
# The head-to-head report text (table rows and prose caveats) is data, not code style.
"benchmarks/hook_fidelity/compare.py" = ["E501"]
# The local-model lane: prose docstring, table headers and row builders are data, not code style.
"benchmarks/hook_fidelity/model_lane.py" = ["E501"]
