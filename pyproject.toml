[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentshield-mcp"
version = "0.4.0"
description = "IntentShield for MCP: an offline-first security guardrail against prompt injection in MCP tool calls, with hooks for Claude Code, Codex CLI, Cursor and Gemini CLI and a transparent MCP proxy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
  "intentshield", "mcp", "model-context-protocol", "mcp-security", "mcp-proxy", "prompt-injection", "tool-poisoning",
  "guardrail", "guardrails", "agent-security", "llm-security", "ai-security", "claude-code", "codex", "cursor", "gemini-cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "mcp>=2.2,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "pytest>=8,<10",
  "ruff>=0.14,<1",
]
# The exemplar detector and learning from operator labels (exemplars.py, learning.py); its
# embedder also needs the ML requirements (requirements-ml.txt).
learning = [
  "numpy>=1.26,<3",
]

[project.urls]
Homepage = "https://github.com/Suhas-123-cell/IntentShield"
Repository = "https://github.com/Suhas-123-cell/IntentShield"
Documentation = "https://github.com/Suhas-123-cell/IntentShield/blob/main/docs/README.md"
Issues = "https://github.com/Suhas-123-cell/IntentShield/issues"
Changelog = "https://github.com/Suhas-123-cell/IntentShield/blob/main/CHANGELOG.md"

[project.scripts]
intentshield = "intentshield.__main__:main"
intentshield-mcp = "intentshield.mcp_server:main"
intentshield-demo-mcp = "intentshield.demo_mcp_server:main"
intentshield-mcp-verify = "intentshield.mcp_verify:main"
intentshield-hook = "intentshield.harness:main"
intentshield-eval = "intentshield.evaluation:main"
intentshield-threats = "intentshield.threat_memory:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
# Source, tests, configs and the paper's numbers; not the raw benchmark traces (results/) or the lock.
include = ["src/intentshield", "tests", "configs", "benchmarks/*.py", "benchmarks/coverage", "README.md", "LICENSE", "CHANGELOG.md",
           "pyproject.toml", "requirements-ml.txt"]
exclude = ["results", "artifacts", "docs"]

[tool.hatch.build.targets.wheel]
packages = ["src/intentshield"]

[tool.hatch.build.targets.wheel.force-include]
"configs/policy.json" = "intentshield/configs/policy.json"
"configs/mcp-proxy.uvx.json" = "intentshield/configs/mcp-proxy.demo.json"

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["artifacts", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "E731", "B008", "B023", "B904", "B905", "UP035", "UP037"]
