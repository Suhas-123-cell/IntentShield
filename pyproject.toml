[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intentshield-mcp"
version = "0.4.3"
description = "IntentShield for MCP: an offline-first security guardrail against prompt injection in MCP tool calls, with hooks for Claude Code, Codex CLI, Cursor and Gemini CLI and a transparent MCP proxy"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Maddali Suhas Choudary" }]
requires-python = ">=3.12"
keywords = [
  "intentshield", "mcp", "model-context-protocol", "mcp-security", "mcp-proxy", "prompt-injection", "tool-poisoning",
  "guardrail", "guardrails", "agent-security", "llm-security", "ai-security", "claude-code", "codex", "cursor", "gemini-cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
]
# Every third-party package that src/intentshield imports at module level or in the proxy server is listed here, not
# only reached through mcp or fastapi (tests/test_import_declarations.py checks this).
dependencies = [
  "anyio>=4.5,<5",
  "fastapi>=0.115,<1",
  "httpx2>=2,<3",
  "jsonschema>=4.23,<5",
  "mcp>=2.2,<3",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "starlette>=0.40,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "cryptography>=43",
  "httpx>=0.28,<1",
  "mypy>=1.13,<3",
  "numpy>=1.26,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.14,<1",
]
# Ed25519 signatures on threat packs (rule_packs.py); a signed pack is refused without it.
signing = [
  "cryptography>=43",
]
# The exemplar detector and learning from operator labels (exemplars.py, learning.py); its
# embedder also needs the ML requirements (requirements-ml.txt).
learning = [
  "numpy>=1.26,<3",
]

[project.urls]
Homepage = "https://github.com/Suhas-123-cell/IntentShield"
Repository = "https://github.com/Suhas-123-cell/IntentShield"
Documentation = "https://github.com/Suhas-123-cell/IntentShield/blob/main/docs/README.md"
Issues = "https://github.com/Suhas-123-cell/IntentShield/issues"
Changelog = "https://github.com/Suhas-123-cell/IntentShield/blob/main/CHANGELOG.md"

[project.scripts]
intentshield = "intentshield.__main__:main"
intentshield-mcp = "intentshield._launch:mcp"
intentshield-demo-mcp = "intentshield._launch:demo_mcp"
intentshield-mcp-verify = "intentshield._launch:mcp_verify"
intentshield-hook = "intentshield.harness:main"
intentshield-wrap-hook = "intentshield.wrap_hook:main"
intentshield-eval = "intentshield._launch:evaluation"
intentshield-threats = "intentshield._launch:threats"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# A misspelled marker or config key is an error, not a silently ignored name.
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true

# Run with: pytest --cov. A report, not a goal: the full suite measured 90% on macOS (Python 3.14) on 2026-11-11, and the floor sits
# five points below so a skipped test or a platform difference does not fail the build but a module left untested does.
[tool.coverage.run]
source = ["src/intentshield"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.hatch.build.targets.sdist]
# The package and what it builds from. Not tests/ or benchmarks/: the tests read the study's docs and
# committed traces (results/, docs/), which are too large to ship, so a test run needs a clone of the repository.
# A leading slash anchors a name at the project root; a bare README.md would also match every README.md in docs/ and results/.
include = ["/src/intentshield", "/configs", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/pyproject.toml",
           "/requirements-ml.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/intentshield"]

[tool.hatch.build.targets.wheel.force-include]
"configs/policy.json" = "intentshield/configs/policy.json"
"configs/mcp-proxy.uvx.json" = "intentshield/configs/mcp-proxy.demo.json"

[tool.mypy]
python_version = "3.12"
files = ["src/intentshield"]
# Everything in --strict except warn_unused_ignores, which depends on whether the optional ML packages are installed.
# The flags below that still fail in some modules are switched off for those modules only, in the lists that follow;
# a module leaves its list when it passes, and a new module starts under the full set.
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true

# Still failing disallow_untyped_defs:
[[tool.mypy.overrides]]
module = ["intentshield.api", "intentshield.evaluation", "intentshield.injection_training", "intentshield.install", "intentshield.mcp_proxy", "intentshield.mcp_server", "intentshield.rule_packs", "intentshield.translation", "intentshield.wrap_hook"]
disallow_untyped_defs = false

# Still failing disallow_incomplete_defs:
[[tool.mypy.overrides]]
module = ["intentshield.api", "intentshield.evaluation", "intentshield.injection_training", "intentshield.install", "intentshield.mcp_proxy", "intentshield.mcp_server", "intentshield.translation", "intentshield.wrap_hook"]
disallow_incomplete_defs = false

# Still failing disallow_untyped_decorators:
[[tool.mypy.overrides]]
module = ["intentshield.mcp_server"]
disallow_untyped_decorators = false

# Still failing warn_return_any:
[[tool.mypy.overrides]]
module = ["intentshield.api", "intentshield.harness", "intentshield.injection_classifier", "intentshield.intent_classifier", "intentshield.intent_training", "intentshield.mcp_proxy", "intentshield.mcp_server", "intentshield.mcp_upstream", "intentshield.storage", "intentshield.threat_memory", "intentshield.translation"]
warn_return_any = false

# Still failing disallow_untyped_calls:
[[tool.mypy.overrides]]
module = ["intentshield.exemplars", "intentshield.threat_memory", "intentshield.translation"]
disallow_untyped_calls = false

# Still failing disallow_any_generics:
[[tool.mypy.overrides]]
module = ["intentshield.signatures", "intentshield.threat_memory", "intentshield.translation"]
disallow_any_generics = false

# Optional or untyped third-party packages: the ML extras are not installed in CI, jsonschema ships no stubs.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "huggingface_hub", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 130
target-version = "py312"
# prevalence: one-off GitHub census scripts kept for provenance, not maintained code
extend-exclude = ["artifacts", "results", "benchmarks/hook_fidelity/prevalence"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "E731", "B008", "B023", "B904", "B905", "UP035", "UP037"]

[tool.ruff.lint.per-file-ignores]
# The corpus readings are prose data (long quoted lines, printf-style row builders): not code style.
"benchmarks/hook_fidelity/corpus_build/*.py" = ["E501", "UP031", "I001"]
# Guard capture and replay: long prose strings (reasons, quoted payloads, table rows) are data, not code style.
"benchmarks/hook_fidelity/guard_capture.py" = ["E501"]
"benchmarks/hook_fidelity/guard_replay.py" = ["E501"]
# The head-to-head report text (table rows and prose caveats) is data, not code style.
"benchmarks/hook_fidelity/compare.py" = ["E501"]
# The local-model lane: prose docstring, table headers and row builders are data, not code style.
"benchmarks/hook_fidelity/model_lane.py" = ["E501"]
