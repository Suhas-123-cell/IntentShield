# Keeps the SHA-pinned actions in .github/workflows, the Docker base image and the locked Python dependencies current; the update PR shows
# the new tag or version. Each kind arrives together in one pull request a month, not one pull request per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
