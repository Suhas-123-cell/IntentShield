name: audit

# Checks the locked dependencies against the PyPI advisory database. An advisory that has a fixed
# version fails the run (move uv.lock to it); one with no fix yet is printed and does not. It also
# runs weekly, because a new advisory can appear for a lock file nobody has touched.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.11.16"
      - name: Export the locked packages, runtime, extras and the dev group
        run: uv export --frozen --no-emit-project --all-extras --all-groups --no-hashes -o requirements-audit.txt
      - name: Look them up
        run: uvx --from pip-audit==2.10.1 pip-audit -r requirements-audit.txt --no-deps --disable-pip --format json -o audit.json || test -s audit.json
      - name: Fail only for advisories that have a fix
        run: python3 .github/scripts/audit_gate.py audit.json
