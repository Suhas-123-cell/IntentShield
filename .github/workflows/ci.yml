name: ci

# Runs on every push to main and every pull request (a pull request covers its own branch, so a
# branch is not tested twice), and is called by publish.yml for a version tag, so a release only
# uploads after this workflow passes for the tagged commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
      - run: uv sync --group dev --frozen --python ${{ matrix.python }}
      - name: Lint and types, once (the result does not depend on the Python or the system)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' }}
        run: |
          uv run ruff check src tests benchmarks
          uv run mypy  # config in pyproject.toml
      - name: No bare wall-clock bounds in tests (use limit() from tests/timelimits.py)
        run: "! grep -rnE '(perf_counter|monotonic|time\\.time)\\(\\) *- *[A-Za-z_0-9]+ *< *[0-9]|(took|elapsed) *< *[0-9]|< *[0-9.]+ *\\* *[A-Za-z_]+\\(' tests"
      - name: Tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python == '3.12') }}
        run: uv run pytest -q
      - name: Tests with a coverage report (the floor is fail_under in pyproject.toml)
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.12' }}
        run: uv run pytest -q --cov
      - run: INTENTSHIELD_RUN_HTTP_E2E=1 uv run pytest -q tests/test_mcp_http_e2e.py
      - run: uv run python benchmarks/review_gate.py  # benign reviews per task vs results/improve/baseline

  lowest:
    # The oldest version of every direct dependency that pyproject.toml allows, resolved afresh (not from uv.lock), so that a
    # floor that stopped being true fails here and not on a user's machine.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
      - run: uv sync --resolution lowest-direct --group dev --python 3.11
      - run: uv run --no-sync pytest -q

  next-python:
    # A Python that is not supported yet. The backtracking check on proposed rules (signatures.py) reads the private re._parser
    # module, which a new Python may move; a failure here is a warning and does not fail the workflow.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.16"
      - run: uv sync --group dev --frozen --python 3.15 --python-preference only-managed
      - run: uv run pytest -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t intentshield .
      - run: docker run --rm intentshield
