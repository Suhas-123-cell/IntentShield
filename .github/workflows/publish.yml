name: publish

# Runs only for a version tag (v0.2.1, ...): the full test workflow (ci.yml) and the package build (build.yml) run for the tagged
# commit, and the upload to PyPI waits for both. The upload uses PyPI trusted publishing: add this repository, workflow
# "publish.yml" and environment "pypi" as a trusted publisher of the project intentshield-mcp on pypi.org; no token is stored
# anywhere. Pushes to main and pull requests run ci.yml and build.yml on their own, so no job of this workflow is skipped there.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    uses: ./.github/workflows/build.yml

  pypi:
    needs: [build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
